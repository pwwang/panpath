[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panpath"
dynamic = ["version"]
description = "Universal sync/async local/cloud path library with pathlib-compatible interface"
authors = [{name = "panpath contributors"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<4.0"
dependencies = [
    "typing-extensions>=4.0.0",
]
keywords = ["path", "pathlib", "s3", "gcs", "azure", "cloud", "async", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

[tool.hatch.version]
path = "panpath/__init__.py"

[project.urls]
Homepage = "https://github.com/pwwang/panpath"
Repository = "https://github.com/pwwang/panpath"
Documentation = "https://github.com/pwwang/panpath#readme"

[project.optional-dependencies]
# Sync cloud storage backends
s3 = ["boto3>=1.20.0"]
gs = ["google-cloud-storage>=2.0.0"]
azure = ["azure-storage-blob>=12.0.0"]

# Async cloud storage backends
async-s3 = ["aioboto3>=11.0.0", "aiofiles>=23.0.0"]
async-gs = ["gcloud-aio-storage>=9.5", "aiofiles>=23.0.0"]
async-azure = ["azure-storage-blob>=12.0.0", "aiofiles>=23.0.0"]

# Aggregated extras
all-sync = ["boto3>=1.20.0", "google-cloud-storage>=2.0.0", "azure-storage-blob>=12.0.0"]
all-async = ["aioboto3>=11.0.0", "gcloud-aio-storage>=9.5", "azure-storage-blob>=12.0.0", "aiofiles>=23.0.0"]
all = ["boto3>=1.20.0", "google-cloud-storage>=2.0.0", "azure-storage-blob>=12.0.0", "aioboto3>=11.0.0", "gcloud-aio-storage>=9.5", "aiofiles>=23.0.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "python-dotenv>=1,<2",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "moto[s3]>=4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkapi-fix>=0.1",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["panpath*"]

[tool.setuptools.package-data]
panpath = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -n auto --cov=panpath --cov-report=term-missing --cov-config=.coveragerc"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
reportMissingImports = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
